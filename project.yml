name: OnDeviceSpeechCoach
options:
  bundleIdPrefix: com.andrewliu
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""  # set your team ID or leave blank for simulator

targets:
  OnDeviceSpeechCoach:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: OnDeviceSpeechCoach/Info.plist
      properties:
        CFBundleDisplayName: Speech Coach
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "This app records your voice locally to analyze your speaking pace and fluency. No audio leaves your device."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: OnDeviceSpeechCoach/OnDeviceSpeechCoach.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewliu.OnDeviceSpeechCoach
        INFOPLIST_FILE: OnDeviceSpeechCoach/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    sources:
      - path: OnDeviceSpeechCoach
        excludes:
          - "**/*.xcprivacy"
          - "**/*.mlpackage/**"
    resources:
      - path: OnDeviceSpeechCoach/Privacy/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: OnDeviceSpeechCoach/Resources/FluencyScorer.mlpackage
        buildPhase: resources
  OnDeviceSpeechCoachTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.andrewliu.OnDeviceSpeechCoachTests
        INFOPLIST_FILE: OnDeviceSpeechCoachTests/Info.plist
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/OnDeviceSpeechCoach.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/OnDeviceSpeechCoach
        BUNDLE_LOADER: $(TEST_HOST)
    sources:
      - path: OnDeviceSpeechCoachTests
    dependencies:
      - target: OnDeviceSpeechCoach
